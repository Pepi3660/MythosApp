name: mythosapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  provider: ^6.1.2
  dio: ^5.7.9
  intl: ^0.19.0
  image_picker: ^1.2.0

  # Map & calendar
  google_maps_flutter: ^2.12.1
  geolocator: ^12.0.0
  table_calendar: ^3.1.2

  # NUEVO: clustering, SVG para marker y preferencias
  google_maps_cluster_manager: ^3.0.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.3.2
  
  # Typography and UI improvements
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  
  # Device permissions and settings
  permission_handler: ^12.0.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  # Abrir "Cómo llegar"
  url_launcher: ^6.3.0
  
  # Firebase
  firebase_core:  ^4.1.0
  firebase_auth: ^6.0.2
  google_sign_in: ^6.2.1

    #Manejador de los links para el otp
  app_links: ^6.4.1
  cloud_firestore: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  firebase_storage: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  
flutter_native_splash:
  color: "#FFFFFF"
  # Color de fondo para modo oscuro
  color_dark: "#282828"   # mismo tono que esta AppTheme.dark
  image: assets/LogoP.png
  android_12:
    image: assets/LogoP.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#282828"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logov4.jpg"
  remove_alpha_ios: true
  min_sdk_android: 21
  android_12:
    image: assets/Logov4.jpg

  
flutter:
  uses-material-design: true

  assets:
  - assets/
